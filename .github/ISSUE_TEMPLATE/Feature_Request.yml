name: '🚀 Feature Request / Idea'
description: Suggest a new feature or improvement (this does not mean you have to implement it).
type: Feature
labels:
- Issue-Feature
- Needs-Triage
body:
  - type: markdown
    attributes:
      value: |
        Suggesting a feature does not mean you have to implement it.

        Want to work on it? Say so here and follow the
        [contribution process](https://github.com/microsoft/mxc/blob/main/CONTRIBUTING.md#get-maintainer-agreement-for-features).
        Wait for maintainer acceptance and any required spec approval and
        merge before starting implementation.
  - type: textarea
    attributes:
      label: Description of the new feature / enhancement
      placeholder: |
        A clear and concise description of what the problem is that the new feature would solve.
        Describe why and how a user would use this new functionality (if applicable).
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed technical implementation details
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: false